name: Karibik Cigar Stock Monitor

on:
  schedule:
    # 国际标准时间每小时的第 0 分钟自动执行一次
- cron: '*/10 * * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击随时测试

jobs:
  check-cigar-stock:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许自动保存库存缓存文件

    steps:
      - name: 检出仓库代码与缓存
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 执行古巴雪茄库存扫描与比对
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: "jkuiwasd@gmail.com"
        run: |
          python cigar_monitor.py --once

      - name: 提交并保存最新库存快照到 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add cigar_inventory_cache.json || true
          git commit -m "Auto update cigar inventory cache [skip ci]" || echo "No changes to cache"
          git push || true
